<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#080810"><title>CP Soundboard</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:radial-gradient(ellipse at top,#1b1230 0%,#0b0b15 42%,#07070d 100%);color:#f5f3ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;padding:22px 16px 30px}.wrap{max-width:540px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.brand{font-size:12px;letter-spacing:3px;color:#a78bfa;font-weight:800}.title{font-size:32px;font-weight:900;letter-spacing:-1px;margin:5px 0}.sub{font-size:13px;color:#9895aa}.badge{border:1px solid #4c287b;background:#211334;color:#c4a7ff;border-radius:99px;padding:7px 10px;font-size:11px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pad{position:relative;min-height:132px;border:1px solid #292638;background:linear-gradient(145deg,#171622,#101018);border-radius:20px;padding:15px;overflow:hidden;text-align:left;color:white;cursor:pointer;transition:transform .12s,border .12s,filter .12s;box-shadow:0 8px 22px #0004}.pad:active{transform:scale(.96)}.pad.playing{border-color:var(--accent);filter:brightness(1.3);box-shadow:0 0 24px color-mix(in srgb,var(--accent) 35%,transparent)}.pad:before{content:'';position:absolute;width:95px;height:95px;border-radius:50%;background:var(--accent);opacity:.12;filter:blur(20px);right:-20px;top:-25px}.emoji{font-size:26px;display:block;margin-bottom:13px}.name{font-weight:800;font-size:14px;line-height:1.25;position:relative}.small{font-size:10px;color:#9b98a8;margin-top:6px;position:relative}.stop{width:100%;margin-top:15px;padding:15px;border-radius:16px;border:1px solid #583045;background:linear-gradient(90deg,#451525,#24111d);color:#ff9bb8;font-size:14px;font-weight:900;letter-spacing:1px}.stop:active{transform:scale(.98)}.foot{text-align:center;color:#6e6a7e;font-size:11px;margin-top:18px}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">POCKET AUDIO CHAOS</div><div class="title">CP Soundboard</div><div class="sub">Tap a pad. Let the nonsense begin.</div></div><div class="badge" id="countBadge">0 SOUNDS</div></div><div class="grid" id="grid"></div><button class="stop" onclick="stopAll()">■ &nbsp; STOP ALL SOUNDS</button><div class="foot">Add audio files to app/src/main/assets/sounds and rebuild · Offline playback</div></div>
<script src="sounds-data.js"></script>
<script>
const grid=document.getElementById('grid');let active=[];
const colors=['#f59e0b','#ec4899','#8b5cf6','#06b6d4','#f97316','#22c55e','#e879f9','#3b82f6','#ef4444','#14b8a6'];
const emojis=['🔊','🎤','🎵','📁','🔥','💾','🎶','⚡','🎧','🌀'];
function prettyName(filename){return filename.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
function stopAll(){active.forEach(a=>{a.pause();a.currentTime=0});active=[];document.querySelectorAll('.pad').forEach(p=>p.classList.remove('playing'))}
(window.SOUND_FILES||[]).forEach((file,i)=>{const s={name:prettyName(file),file,emoji:emojis[i%emojis.length],color:colors[i%colors.length]};const b=document.createElement('button');b.className='pad';b.style.setProperty('--accent',s.color);b.innerHTML=`<span class="emoji">${s.emoji}</span><div class="name"></div><div class="small">TAP TO PLAY · ${String(i+1).padStart(2,'0')}</div>`;b.querySelector('.name').textContent=s.name;b.onclick=()=>{const a=new Audio('sounds/'+s.file);a.currentTime=0;active.push(a);b.classList.add('playing');a.onended=()=>{b.classList.remove('playing');active=active.filter(x=>x!==a)};a.play().catch(()=>{b.classList.remove('playing')})};grid.appendChild(b)});
document.getElementById('countBadge').textContent=(window.SOUND_FILES||[]).length+' SOUNDS';
</script>></body></html>
